body:
  text: 宋𣈆水沙門淨源述夫化制互陳戒定齊舉莫大乎遺教經焉推徵解釋開誘行業莫深於馬鳴論矣然則論主發揮遺教亦猶龍樹啓明大品歟彼則融有而即空此乃扶律以詮定是故中夜三唱圓戒珠以嚴身上士七科滋法乳而延命既而寡尤寡悔二乘由是而功成即事即心三賢於斯而果滿非夫至聖最後垂範者則安能至於茲乎在昔羅什法師既翻于經而真諦三藏續譯于論故得有唐太宗降乎勑命永懷聖教用思弘闡而辭林載之昭昭然若懸日月於太清令萬物之咸覩也至若昔賢通經雖具章門而綿歷歲時罕有傳者近世孤山尊者仰經述疏多遵台教遂使輿宗思而不學抑又真悟律師以論注經雖不忘本而皆存梵語闕譯華言淨源久慨斯文流芳未備於是翻經論之格訓集諸家之奧辭庶乎後裔皆受其賜耳二別釋經文二初釋名題二解文義今初佛遺教經經題有通別二名佛遺教別名也經即通名耳梵語具云佛陀此翻覺者謂覺了性相之者然具三義一自覺覺知自心本無生滅二覺他覺一切法無不是如三覺滿二覺理圓稱之為滿若凖起信亦彰三義一始覺即能證智二本覺即所證理三究竟覺即智與理冥始本不二也又佛地論第一説佛有其十義恐繁不引遺教者謂遺留教誡勗彼羣機也教者俲也使衆生俲之耳經者梵語修多羅古譯為契經正翻為線此方不貴線稱故存於經故佛地論云能貫能攝故名為經以佛遺教貫穿所應説義攝持所化衆生故亦名佛垂涅槃略説教誡經然上正題人法齊舉以標美號今茲別名亦爾但廣略有異梵音涅槃秦言滅度義翻圓寂考諸唯識有其四種一自性清淨涅槃二有餘涅槃三無餘涅槃四無住涅槃若乃一往分文摘字申義亦具二種謂佛説教誡道洽德施即有餘也而垂涅槃身灰智滅即無餘也姚秦三藏法師鳩摩羅什譯姚秦即後秦姓姚名興具云鳩摩羅什婆此云童壽以童子之年有壽者之智耳其翻宣經論宏功茂德傳文敘之詳矣譯者周禮秋官司寇云北方掌語之官曰譯二解文義依吾祖馬鳴論文大科有七初序分二修習世間功德分三成就出世間大人功德分四顯示畢竟甚深功德分五顯示入證決定分六分別未入上上證為斷疑分七離種種自性清淨無我分然諸經文多明三分初序分二正宗三流通而序分有證信發起之殊今經但有發起正宗而無證信流通例如般若心經義歸一揆抑又今所述注翻梵從華發辭中義則多録孤山疏文若夫譯摩訶衍此云大乘則遵起信論旨其或辨注懸科引文託證則略為改易至于判教被機復引祖訓為其正教量耳初序分有六初法師成就畢竟功德釋迦牟尼佛釋迦此翻能仁姓也牟尼此翻寂默字也故馬鳴論云能仁以家姓尊貴即別相也寂默以自體清淨即總相也若總若別唯佛兼之即十號之一也然則能仁約事為別寂默約理為總佛該總別而理事融通其唯大覺乎是則以大覺為大法師矣二開法門成就畢竟功德初轉法輪佛初成道於鹿野苑三轉四諦法輪法即軌持輪者如帝王輪從喻得名若約法説圓摧障惱名轉法輪俱舍論亦名梵輪如來大梵之所轉故大疏云流演圓通名之為輪自我之彼故名為轉度阿若憍陳如陳如翻火器姓也阿若翻無知名也然四十二章經為憍陳如等五人一陳如二頞陛三跋提四十力迦葉五摩訶拘利今但標上首以攝餘四然此法門成就則初轉法輪最後説法後弟子成就則陳如跋陀而聖智之巧隔句配義三弟子成就畢竟功德最後説法本論約白淨法二種釋之此句則涅槃白淨法上句初轉法輪則道場曰淨法度須跋陀羅此云好賢或云善賢外道名也住鳩尸那城年一百二十聞佛涅槃方往佛所聞八聖道心意開明遂得初果乃從佛出家又為廣説四諦即成羅漢四大總相成就畢竟功德所應度者皆已度訖謂中間所度其人無量故科為大總相也五因果自相成就畢竟功德於婆羅雙樹間因詣雙樹然後示滅故論云因自相也娑羅此翻堅固言雙樹者上枝相合下根相連一榮一枯相合似連理榮枯似交讓其華如芙蕖果大如瓶其甘如蜜準涅槃經則四方各雙即表四德以破八倒若依三卷經文似唯一雙以破斷常此亦大小二機所見各別將入涅槃將入是因涅槃是果故論云因共果自相也上明雙樹若表四德即無住涅槃今文即捨有餘入無餘也是時中夜成就二種中道故論云總自相也一者正覺中道二者離正覺中道故知中夜入滅表離斷常二邊矣寂然無聲既離正覺中道故論云果自相也寂然者自性離念也無聲者自性無説也即自性清淨涅槃心言同及亦是本論自性無説離念涅槃果耳六分別總相成就畢竟功德為諸弟子上首眷屬人位差別諸者不一也學居師後故言弟解從師生故稱子略説法要世出世間法位差別下文第二分即世間法從三至七皆出世法序分竟大文第二修習世間功德文三初對治邪業功德二對治修習止苦功德三對治修習滅苦惱功德此即三障也若是報障餘二如文修此對治止離四趣未出三界故總明世間功德也初文分四初依根本清淨戒汝等比丘比丘梵語此含三義一怖魔二乞士三破惡論云此修多羅中每説比丘者示現遠離相故復示摩訶衍方便道與二乘共故又於四衆亦同遠離行故凖起信論摩訶衍此翻大乘大即體相用三大乘也即諸佛菩薩所乘法故下經示堪忍道即菩薩所乘若謂今經約始終小機所見得析空寂默屬藏教者恐失馬鳴深旨矣於我滅後示現遺教義故當尊重珍敬波羅提木叉即不盡滅法也以不盡法清淨法身常為世間作究竟度故令尊重珍敬梵語波羅提木叉此翻別別解脫亦云處處解脫謂身口七非五篇等過不令有犯故得前名戒體既全克取聖果故彰後號論云此木叉亦是毗尼相順法故復是諸行調伏義故次示解脫得度二種障如暗遇明度有煩惱暗障如盲得眼貧人得寶度空無善根障如滿足財寶當知此則是汝大師示現波羅提木叉是修行大師若我住世無異此也示住持利益人法相似故以佛處世常以篇聚訓人此法既存則如佛在此則清淨法身不滅也二方便遠離清淨戒論云護根本淨戒此護初文依根本義有其二種一者不同凡夫增過護二者不同外道智護遮戒雖多今約喜犯者曲加誡勉能止此惡則名清淨令初不同凡夫增過護持淨戒者不得不得兩字貫於下文販一方便求利過賣二現前求利過貿易三交易求利過論云若依世價無求利心不犯貿易謂交博也如以衣易衣以衣易鉢等薩婆多論以四義制之安置田宅四所安業處求多安隱過善見云居士施田地別人不得用若供養僧者得受若以池施僧供給浣濯及一切衆生聽飲用者隨意得受畜養人民五眷屬增過此示外眷屬非同意者何故不但言人而復説民者以其同在人中於善法不了畜之生漏故增一云長者將施佛不受若受者漸生重罪僧秖云若施園民婦人不應受若言施供給僧男淨人得受尼僧反之奴婢六難生卑下心過日藏分云於我法中假令如法始從一人乃至四人不聽受田宅園林車馬奴婢等常住物若滿五人乃得受之大集亦同畜生七養生求利過四分律云比丘畜貓狗乃至衆鳥並不得畜南山云今有施佛法家畜生而知事有賣者並不合聖教一切種植八多事增過僧秖云為僧管理者別得人不開自種教他一切不合及諸財寶九積聚增過若元作自畜之意不合若擬淨施與他依律文開僧祇云若病人得者令淨人畜為貿藥故又云末利夫人施僧布薩錢佛言聽受凖義付他善見云若施器仗僧應打壞不得賣施樂器者不得捉得賣皆當遠離如避火坑文雖在前義則居後故論主云此十種增過事修行菩薩宜速遠離不應親近避大火聚相似法故不得斬伐草木墾土掘地十不類威儀及衆生過外人妄計草木有命如來順世息謗不得斬伐草木以示慈心即毗尼中壞生種戒墾土掘地即掘地戒四分律云若野火來近寺為護住處故比丘得剗草掘土以斷火故薩婆多論不掘地壞生凡有三益是名大護有本云不得參預世事為十一過者文既在復今所不依二不同外道智護謂世間分別見故此分明見有五句十種文二初行法根本合和湯藥以邪心求利故若學五明以清於物如華嚴中學醫方明謂善方藥療治衆病即五地菩薩耳占相吉凶周易云吉凶與民同患若依華嚴學工巧明謂占相工業四前世善惡為因感此吉凶之報仰觀星宿同不淨活命觀視星宿也宿音秀謂五星二十八宿等推步盈虛步亦推也周易云天地盈虛與時消息歷數算計歷數列次也尚書洪範云五曰歷數孔達正義謂算日月行道所歷計氣朔早晚之數所以為一歲之歷皆所不應總結遮止論云遮異見也夫沙門者志求解脫當制心一處豈得攻乎異端減正智且秦緩不救膏肓裨竈安知天道世間方術信虛誑矣假如法門之慈濟一行之闡揚則釋子之五明有裨正化世有內昧道要影附高蹤惟利是求不思聖制往不可諫來者可追昔人以此行法根本注為懸科者無乃失之於近乎有謂其行法根本即是前文依根本清淨戒者此又失之於遠矣且馬鳴謂此修多羅中建立菩薩所修行法有七分所修行法既通一經故凖近文科此五句如謂未然吾從論也二行處根本三初身處木叉節身儉絶他求勤捨放逸時食離非時食於食知止足也清淨自活不相追求遠離四邪不得參預世事自性止多事故通致使命自性不作輕賤事故夫出家者無為無欲孤高自守若為使命則降志辱身廢亂正業易曰不事王侯高尚其事况乎形服超世而甘為賤役良用慨然律開為父母等馳書往反一切不犯二口處木叉呪術仙藥依邪法語有二一呪術依邪術惱亂衆生語二仙藥依邪藥作世辨不正語結好貴人親厚媟慢皆不應作依邪人語有二一與族姓同好多作鄙媟語二親近族姓多作我慢語貴人謂族姓權豪也媟狎也郭璞云相親狎也三意處木叉當自端心無見他過也見他過則不能自淨其心正念求度勿得邪思也起邪思則無由超度下地不得包藏瑕疵起嗔毒故有過不甘發露顯異惑衆起癡毒故現己勝行令他不正解於四供養知量知足趣得供事不應畜積起貪毒故於供不知止足瑕過也疵病也顯異惑衆不出五邪王制曰疑衆者殺毗尼云得聖者夷四供養者謂飲食衣服臥具湯藥趣得供事者知節量知止足不求豐厚故無畜積五百問論昔有比丘多乞積聚既不為福又弗行道命終作肉駱駝山廣數十里適值凶年國人日取食之隨割隨生俄而鄰國取之即大喚問其故答曰吾本道人也為貪財不施負此國人物多矣故以肉償之我不負卿也或曰性重之戒都無教誨者何耶答曰向佛總勸當尊重木叉則包乎五篇輕重性遮無所遺也若唯勗重則將犯輕今輕尚囑重可知矣大為之坊民猶踰之豈得唯約性重乎三結示二戒能生定慧三初別結方便遠離戒此則略説持戒之相前遠離戒據佛滅後人喜犯者略示其相故不廣説也二通示二戒為解脫因戒是正順正以揀邪順不違理則是逆生死流順涅槃流也解脫之本有餘無餘二種解脫以戒為基故云之本故名波羅提木叉牒名證義以木叉翻解脫故此顯戒名木叉從果立稱也三正明二戒能生定慧依因此戒得生諸禪定及滅苦智慧四禪八定由戒而生也戒出三塗定出六欲慧出三界故滅苦果也四別伸五勸修戒利益是故比丘當持淨戒一勸不失自體勿令毀二勸不捨方便若人能持淨戒是則能有善法三勸遠離諸過身語意業常集功德若無淨戒諸善功德皆不得生四勸知多過惡者於三業中一切時不生功德是以當知戒為第一安隱功德住處五顯示菩薩所修戒中有如是得失者我當住安隱處不住不安隱處此正示現勸修利益勝義也二對治修習止苦功德三初根欲放逸苦對治二初根放逸文三此三生起者雖住淨戒若不攝念戒不堅固攝念治障由智裁擇初戒護汝等比丘已能住戒亦是躡前起後二念護三初牧牛喻二初法當制五根各能生識故並名根而不言意者論云示現色非色別故勿令放逸入於五欲應知色如熱金聲如毒鼓香如惡風味如沸蜜觸如虺蛇皆不可著著則傷害故勿令放逸也二喻譬如牧牛之人牛喻五根人喻比丘執杖視之不令縱逸犯人苗稼執杖喻攝念苗稼喻三昧方便及正受功德五欲不起正念成就如不犯苗稼也二惡馬喻二初法若縱五根非唯五欲若不攝守五根非獨起欲妨道將無涯畔不可制也起欲妨道將沉苦海而無涯畔既失戒念對治甚難故不可制也故須防萌杜漸勿令動心二喻亦如惡馬喻五根不以轡制喻無正念將當牽人墜於坑陷喻沉惡道三劫賊喻二初喻如被劫害苦止一世澄照戒疏云公白而取曰劫後法五根賊禍殃及纍世招殃纍世苦又過之為害甚重不可不慎勸慎五根誡勿起欲三智護是故智者制而不隨有智之人故名智者夫有智則能裁斷是非分別利害既知戒念是利而非害故制而不隨持之如賊不令縱逸既知根欲是害而非利故持之如賊論云此是重障故不令縱下示輕障假令縱之謂細相習障縱有根欲不作意起也皆亦不久勢無自立故見其磨滅云何立見示現依見時説故譬之無常必歸磨滅二欲放逸苦對治四初標由心此五根者心為其主五根起欲皆是自心若本無心五塵寧染則知心王而為主也二勸勤遮是故汝等當好制心既知五欲悉由心故故勸防制瑞應經云得一心則萬邪滅矣二示障法三初心性差別障心之可畏招感生死無解脫期既皆由心安得不畏甚於毒蛇喻嗔心對違境惡獸喻癡心對中庸境怨賊喻貪心對順境三毒為害過彼蛇等故云甚於大火越逸未足喻也大火遍燒以喻等分等分越逸亦過大火故未足喻矣二輕動不調障動轉輕躁識遍諸根動無暫停但觀於蜜不見深坑喻心有暟不見未來百喻經云昔有貪夫於野求蜜既得一樹舉足前進欲取蜂蜜不覺草覆深井因跌足而亡譬如狂象無鉤喻心起三毒也涅槃經以醉象狂逸如貪恚愚癡醉故多造惡業猿猴得樹喻根起五欲也有説譬如一猴現於五窗心猴亦爾遍彼五根騰躍踔躑難可禁制騰躍釋上狂象踔躑釋上猿猴踔丑教切切韻曰猿跳也當急挫之示其抑入無動處故無令放逸令其攝入調伏聚故三失諸功德障縱此心者喪人善事由不制伏則世出世善悉皆喪滅四修三昧制之一處無二念三昧翻斷心性差別障一處謂心也是故制之於心則四分差別自然休息也無事不辦起多功德三昧翻斷失諸功德障文小不次若依論在後今順經文居中是故比丘當勤精進折伏汝心調柔不動三昧翻斷輕動不調障既知制心之益是故精進折伏不令動轉輕躁也二多食苦對治三初示平等汝等比丘受諸飲食當如服藥藥取療病不分善惡以飲食為藥除飢渴之病亦然於好於惡勿生增減不應於好食增心貪著於惡食減心猒棄取得支身以除飢渴意在除飢渴不取珍昊也二誡多求二初喻如蜂喻諸比丘採華喻受供養但取其味喻除飢渴之惱不色香喻不懷善心二合比丘亦爾受人供養趣自除惱無得多求壞其善心多求長貪故壞其善也三勸籌量譬如智者籌量牛力所堪多少不令過分以竭其力牛能負重若所負過分則竭其力比丘受施多求美食則敗其道二懈怠睡眠苦對治論云懈怠者心懶墯故睡眠者身悶重故此二相順共成一苦然起睡眠乃有三種一從食起二從時節起三從心起前二是阿羅漢眠以彼不從心生故無所蓋故文二初合釋前二睡眠汝等比丘晝則勤心修習善法無令失時對治從食起睡眠初夜後夜亦勿有廢中夜誦經以自消息對治從時節起睡眠無以睡眠因緣令一生空過無所得也總結前過上二皆以精進勤䇿為能治也智度論云眠如大暗無所見日月欺誑奪人明是故宰子晝寢仲尼貽朽木之責那律假寐能仁興蚌蛤之譏眠之廢學妨道其過大矣二離辨後一睡眠論云自餘修多羅示現第三從心起睡眠有二種對治一觀察對治二淨戒對治或曰前二睡眠唯一精進以為能治今茲一種能治具二何耶答夫障有輕重則治有一多前二睡眠從食從時則所治障輕故以精進通而治之今從心起者所治障重故以觀察淨戒約法引喻一一別治耳今初觀察對治當念無常之火燒諸世間無常有二一粗二細一期生滅為粗念念生滅為細論云觀諸生滅壞五陰故世間亦二謂三界是器世間六道是有情世間而此依正悉是速朽如為火燒又仁王經云劫火洞然大千俱壞馬鳴頌無常經云未曾有一事不被無常吞早求自度勿睡眠也示求禪定智慧度所度故諸煩惱賊常伺殺人甚於怨家安可睡眠不自警寤三毒煩惱殺人法身慧命論云觀陰界入等常害故是中可畏求自正覺故二淨戒對治二初正明對治二初明有對治二初示煩惱可畏煩惱毒蛇睡在汝心譬如黑蚖在汝室睡煩惱毒害已自名蛇更舉黑蚖喻之可畏惑在心睡起必害慧蚖在室睡起必害人二勸淨戒斷除當以持戒之鉤早併除之持戒去惑如鉤出蛇此言定共戒也論云禪定相應心戒故四分律云云何為學為調三毒故睡蛇既出乃可安眠上句明斷惑下句示已辦總而示之以戒外防以定內靜故能發慧斷惑也若乃外衒持相內無定慧我慢自高戒取斯起更引黑蚖以歸心室不知其可也智者思之誡之二明無對治不出而眠是無慚人也不能對治煩惱而懈怠安眠此則不恥愚迷名無慚人也二示對治法二初正明勝法慚恥之服於諸莊嚴最為第一慚如鐵鉤能制人非法慚恥二字依經論合釋涅槃云慚者內自羞恥瑜伽云內生羞恥為慚當知既懷慚恥則䇿勤三業不暇寧居而能三學是修速階賢聖故比夫戒定莊嚴為第一也而能制禦非法如鉤制象二勸修勝法二初正示勸修二初勸其常修是故比丘常當慚恥無得暫替是勝莊嚴故勸常修二遠離致若離慚恥則失諸功德若離慚恥則不能持戒戒不淨故定不成定不成故慧不發三者俱無則世間出世間功德從何生耶故失功德耳二有無得失有愧之人則有善法若無愧者與諸禽獸無相異也涅槃云愧者發露向人瑜伽云外生羞恥為愧涅槃又謂無慚愧者不名為人即與飛禽走獸無相異也三對治修習滅煩惱功德三初對治瞋恚煩惱三初示堪忍道二初堪忍則三業清淨汝等比丘若有人來節節支解當自攝心無令瞋恨論云修行菩薩住堪忍地中能忍種種諸苦惱故支解無瞋身意淨也亦當護口勿出惡言口業淨也然此一唱經若例金剛論即十八住中第十三忍苦住當信行地也起信亦云如二乘觀智初發意菩薩等彼疏釋云三賢菩薩與二乘同故本論云復示摩訶衍方便道與二乘共故則知此經化身所説攝地前菩薩梵網報身所演攝地上聖人故華嚴疏云梵網即舍那坐千葉華攝離垢地戒波羅蜜耳昔人以遺教是藏通菩薩同稟者頗叶馬鳴奧義若謂梵網是別圓菩薩自稟者似違清涼深文矣二不忍則妨失道德若縱恚心則自妨道失功德利若縱瞋者則自妨己道失化利他二校量最勝忍之為德持戒苦行所不能及謂第二地持戒苦行校量第三地忍辱之德所不能及三約能不能勸誡二初舉能忍興勸能行忍者乃可名為有力大人夫犯而不校世稱君子是故行三種忍悉名大人二約不能伸誡三初明不忍成愚若其不能歡喜忍受惡罵之毒如飲甘露者不名入道智慧人也甘露是諸天長生之藥忍力既成則益法身延慧命故以忍受惡罵喻飲甘露不由彼辱寧顯我忍豬揩金山喻意可識苟不如是則無證道智慧名凡夫愚人二示瞋恚過患二初徵釋過患所以者何上徵下釋瞋恚之害則破諸善法華嚴云一念瞋心起百萬障門開論云善法者自利智慧相故壞好名聞利他善法名稱功德故今世後世人不喜見自他世無可樂果報故二誡令防護當知瞋心甚於猛火常當防護無令得入劫功德賊無過瞋恚論云護自善法如防火護利他功德如妨賊三對白衣校量二初白衣無對治法故容起白衣受欲非行道人無法自制瞋猶可恕恕者聲類日以心度物也既受著五欲復無白淨對治之法容可起瞋出家反是不應瞋也二出家有對治法不應起二初法出家行道無欲之人而懷瞋恚甚不可也二喻譬如清冷雲中喻行道無欲霹靂起火喻懷瞋恚郭璞云雷之急激者謂霹靂非所應也論云示道分中不應有故二對治貢高煩惱二初正設對治汝等比丘夫在家人憑乎容儀以傲於物所以冠冕嚴其首劒珮飾其身朱紫煥其服僮僕供其役帑藏積其財尚須富而無驕卑以自牧我今躍出四民期臻聖果毀其形壞其服狀非驕慢耳當自摩頭反手摩頭知無冠冕之嚴已捨飾好自身已捨劒珮之飾著壞色衣反顧壞服絶朱紫之華彩執持應器應器親持無僮僕之供役以乞自活以乞食養命無帑藏之積財上五句明不應起慢自見如是此一句明智慧成就常自觀察故後一句明慢起應治若起憍慢當疾滅之憍慢設起宜疾思惟以止妄心故當滅之非正色聞色故名壞色四分云壞色青黑木蘭也應器謂鉢也應法之器故名應器憍慢者自舉曰憍陵他曰慢俱舍云慢對他心起憍由染自法二校量不應增長憍慢尚非世俗白衣所宜易曰人道惡盈而好謙老子云柔弱者生剛強者死故知憍慢非世俗所宜何況出家入道之人為解脫故自降其身而行乞也摩頭等五悉是降身舉要而言指歸行乞三對治諂曲煩惱二初舉過設治二初舉過患汝等比丘諂曲之心與道相違希其意而道其言曰諂是故其言諂者其心必曲道尚質直故與相違二設對治是故宜應質直其心守心質直則諂曲不起楞嚴亦云出離生死皆以直心二誡諂勸直二初誡諂曲當知諂曲但為欺誑入道之人則無是處道務質直以曲入道則無所詣二勸質直是故汝等宜當端心以質直為本正道名直離邊觀中捨事求理悉名諂曲三成就出世間大人功德謂三乘聖人由覺知此八而得成道故名此八為出世大人也文八初無求功德五初知覺障相汝等比丘當知多欲之人多求利故苦惱亦多多欲煩惱障也多求業障也若惱亦多報障也二知覺治相少欲之人無求無欲則無此患遠離三種妄相也無求故無業無欲故無惑無患故無苦三知覺因果習起相直爾少欲尚應修習何況少欲能生諸功德直爾少欲已得心安況因少欲忍獲聖果誰聞此利而不修習除彼不肖人盲瞑無智者四知覺無諸障畢竟相少欲之人則無諂曲無惑也以求人意無業也亦復不為諸根所牽無苦也眼根牽人受色乃至身根牽人受觸五知覺畢竟成就相行少欲者心則坦然法身顯矣無所憂畏般若發矣觸事有餘常無不足解脫成矣有少欲者則有涅槃是名少欲三法具足名大涅槃故論云般若等三種功德果成就故又心坦然者離諂誑也無憂畏者不他求也觸事有餘者臥覺一榻之寬覆覺一衾之溫食覺一餐之飽處覺容膝之安斯皆有餘故常無不足既心無他想則涅槃不求而自至矣二知足功德三初對治苦因果汝等比丘若欲脫諸苦惱當觀知足論云是中苦惱者示現煩惱過從苦生故遠離他境界事故二復説清淨因果知足之法即是富樂安隱之處論云成就對治法故於自事中遠離故三示現三種差別三初於二處受用差別知足之人雖臥地上猶為安樂得臥平地且勝牢獄所以安樂不知足者雖處天堂亦不稱意既處金屋更羡瑤臺故不稱意二於二事受用差別不知足者雖富而貧若王戎之牙籌每計其産業知足之人雖貧而富如顏溯之陋巷不改其樂夫不知足者恨珍寶之未多嫌土田之未廣鄙楝宇之未麗凡有施為心常不足非貧而何知足之人雖服絺綌而有狐狢之溫雖食蓁糗而有膏窠之美雖居蓬箄而有廈屋之安夫何故然知足故也涅槃云知足第一富斯之謂矣三於二法中無自利有自他利差別不知足者常為五欲所牽愛色貪聲不知其止既無自利何能愍他為知足者之所憐愍是名知足知足者有二利一不為五欲所牽是自利二能愍他是利他心既憐愍必當教誨老子云不善人者善人之資三遠離功德三初自性遠離門體出故有四對治汝等比丘欲求寂靜無為安樂治我相執著障即三三昧也寂靜者示法無我空故無為者無相空故安樂者無取捨願空故當離憒閙治我所障五衆亂起無次第故衆即我所也故下文云當捨己衆他衆由衆故憒閙獨處間居治彼二無相障即修三三昧也然忘懷去來者市朝亦江湖眷情生死者山林猶桎梏今誡初心宜求間靜則觀道易成耳靜處之人帝釋諸天所共敬重治無為首功德障靜處是可重法於諸善法為其首故能為帝釋諸天所敬重也帝釋具云釋迦因陀羅此云能主言其能為天主居須彌山之頂欲界第二天也二修習遠離門方便出故是故當捨己衆他衆衆即四人已上己衆謂自己弟子及同學也他衆可知捨之則是離我我所不復集生故空間獨處方便慧成就如法而住也思滅苦本善擇智成就遠離起因也法華云諸苦所因貪欲為本三受用諸見門常縛故二初自他心境相惱若樂衆者即自他衆是能惱境則受衆惱即所惱心心既受惱則諸見集生生已自害故次以大樹況之譬如大樹喻於己心衆鳥集之喻自他衆則有枯折之患喻諸見集生二復示無出離相世間縛著沒於衆苦煩惱業染生也譬如老象喻於縛著溺泥喻沒衆苦不能自出是名遠離象故身重縛著厚也老故溺泥觀智微也所以溺衆苦泥不能升出四不疲倦功德二初就法明不退汝等比丘若勤精進則事無難者既無疲倦則於一切法行善能趣入豈同外道無益苦行乎二約喻顯精怠二初精進比小水長流是故汝等當勤精進以成就不退轉故勸修習長養譬如小水長流則能穿石由精勤匪間如水不絶則穿石也二懈怠況鑽火數息若行者之心數數懈廢謂不精進念處退失不成就心慧故譬如鑽火未熱而息雖欲得火火難可得是名精進聖道如火能燒惑薪暖頂已前皆名未熱已熱而息火尚不生未熱數息雖經年劫終無得理此説懈怠過也華嚴頌云如鑽燧求火未出而數息火勢隨止滅懈怠者亦然彼疏約三慧以辨懈怠約聞則聽習數息明解不生約思則決擇數息真智不生約修則定慧數息聖道不生禪宗六相共傳斯喻願諸學者銘心書紳五不忘念功德二初明不忘念二初明行中最勝汝等比丘下文略舉三行求善知識求聞法行善知識通三種一教授善知識二同行善知識三外護善知識今謂求教授也聞名欽德曰知覩形敬奉曰識求善護內善思惟行如聞而思守護不失也助如法修行行也謂如思而修即是以行助解求善助也無如不忘念結為最勝不忘正念於三行中為首為勝故云無如不忘念者上之三行亦名三慧慧以照了為義行以進趣為義照了進趣悉由不忘念也無聞慧如覆器不能受水無思慧如漏器雖受而失無修慧如穢器雖不漏失穢不可用以不忘念則既仰且完而復清淨也故涅槃云四法是涅槃近因一近善知識二聽聞正法三思惟其義四如説修行若言苦行是涅槃因者無有是處今合初二故三也二明能遮重怨若有不忘念者諸煩惱賊則不能入以常念正道故則煩惱怨賊不能入心害三種善根也二辨勸修是故汝等常當攝念在心令初念處成就也三示得失二初失念成就多過若失念者則失諸功德失念謂有始無終也無終則失三慧慧失則聖果無由可階耳二得念成就多功若念力堅強謂不忘念也雖入五欲賊中不為所害上法下喻譬如著鎧入陳則無所畏是名不忘念鎧喻念刀陳喻五欲鎧甲也六禪定功德三初明定二初攝念能生汝等比丘若攝心者心則在定謂八種禪定因攝念生故二定成有用心在定故能知世間生滅法相禪定成就則有果用故能知生滅法相如升太虛下見萬象二勸修是故汝等常當精勤修習諸定精勤對治懈怠無修習方便障也是中懈怠有三種一不安隱懈怠二無味懈怠三不知恐怖懈怠云何修習一一對治示現精勤修習節量食臥及調阿那波那故精勤修習覺知諸定有通慧功德及盡苦原故大希有事故精勤修習觀察生老病死苦及四惡趣苦我未能離故即精進對治也三成就三初法若得定者心則不散功德成就無所對治也二喻譬如惜水之家善治隄塘喻治隄塘則能積水隄限也積土為封限也三合行者亦爾為智慧水故合惜水善修禪定合隄塘令不漏失謂心不散是名為定論云示善修功德上上增長故由禪發智則知世間生滅法相故七智慧功德二初正明智慧破障二初約有慧顯是三初能破理事二障汝等比丘若有智慧則無貪著貪著有二一於真實義處生著名理障也二於世間事處生著名事障也若有智慧則二著不起名破障也二難得常令防護常自省察不令有失於一切時常修心慧故三明其難得能得是則於我法中能得解脫即於第一義處遠離貪著故得解脫二明無慧斥非若不爾者既非道人又非白衣無所名也心無智慧故非道人形已削染故非白衣兩端不攝故無所名二喻顯四種功德二初正明二初喻四初喻聞實智慧者則是度老病死海堅牢船也此三深廣沒溺衆生故如海也聞法起信如得牢船必假思慧為帆檣便風方有所到苟無此二船雖堅牢但在此岸二喻思亦是無明黑暗大明燈也聞而不思則於道黑暗故以思慧喻明燈也三喻修一切病者之良藥也藥以治病如修慧能動惑四喻證伐煩惱樹之利斧也以智斷惑乃證聖果斷惑之智喻之利斧二合是故汝等當以聞思修慧而自增益即證果也二結照覺功能若人有智慧之照雖是肉眼而是明見人也是名智慧四種修學功德於分內處而有照覺名明見人八畢竟功德二初正明戲論汝等比丘若種種戲論其心則亂戲論有二一於真實理生戲論二於世間事生戲論於真實理起四句執是一非諸名戲論當知心之自性離四句故故起定執則撓其性故云其心則亂求那跋摩云諸論各異端修行理無二執者有是非達者無違諍於法戲論尚已不可況為世間詼諧嘲謔耶雖復出家猶未得脫形雖離俗心未證理由乎二種戲論所亂也二勸修遠離二初有對相遠離是故比丘當急捨離亂心戲論有彼彼功德相也二無對相遠離若汝欲得寂滅樂者唯當善滅戲論之患無彼彼功德相也是名不戲論示現行成就體性異故四顯示畢竟甚深功德分二初略明二初菩薩常修功德汝等比丘於諸功德指上所説常當一心無間斷故制之一處即是於第一義心修也捨諸放逸如離怨賊遠離一心相違行如怨故二如來説法功德大悲世尊所説利益皆已究竟始説度陳如終説度須跋故利益究竟耳二廣釋二初常修功德示七種修相汝等但當勤而行之示現常修若於山間若空澤中若在樹下間處靜室示無事處凡有五處皆遠憒閙念所受法示修真實無二念法故勿令忘失令修現前故常當自勉精進修之以方便修無為空死於相似法處蘇息遠離上上心故此謂受著內凡故於一生不能入聖名為空死此誡頂墮人也後致有悔於晚時自知有餘悔不及事故謂臨終方悔者也先民有言臨死修善於計已晚智者云有鄴洛禪師名播河海住則四方雲仰動則百千成羣般般轟轟於世有何利益臨終皆悔二説法功德我如良醫知病説藥良藥喻説法能破惡服與不服非醫咎也又如善導導人善道善導喻説法能生善聞之不行非導過也不受由機非佛過失五顯示入證決定分三初方便顯發門汝等若於苦等四諦有所疑者可疾問之無得懷疑不求決也四諦是行者常觀察及依之起行故勸問也苦則八事遷迫集則惑業牽報滅則二脫離縛道則三學能通於此有疑何能觀察起行耶佛今垂滅故勸疾問二法輪成就門爾時世尊如是三唱示現法輪滿足成就三轉實法故人無問者示現證法滿足成就所以者何衆無疑故示現斷功德滿足成就三分別説法門彼衆上首知大衆心行成就決定復了知所證實義故分別彼彼事以答如來故文二初經家敘時阿䨲樓馱觀察衆心而白佛言阿䨲樓馱亦云阿那律亦阿泥樓豆亦阿難律陀皆一也此翻無貧亦翻無滅亦云如意昔施辟支佛一食獲九十一劫往來人天常受福樂于今不滅所求如意以茲三義故有異翻時為衆首故觀察白佛也二正分別二初佛説無異世尊月可令熱日可令冷先以喻顯也月是太陰精故冷曰是太陽精故熱而性不可易世皆知之今云可熱可冷者日月寧易其性佛言終無變異也佛説四諦不可令異佛説苦諦實苦不可令樂苦樂各實不變異故集真是因更無異因集因定招苦果終非道因所招也論云示苦滅各自因故苦若滅者即是因滅斷集因也又因滅是有餘涅槃因滅故果滅後有田中不生是滅苦果也又果滅是無餘涅槃滅苦之道實是真道更無餘道餘道非真不能趣滅也二比丘無疑世尊是諸比丘於四諦中決定無疑決定者苦樂因果入行決定故無疑者無異無餘義故六分別未入上上證為斷疑分文三初顯示未入上上法二初約未辦二初見滅懷悲於此衆中所作未辦者見佛滅度當有悲感未辦即內外凡及前三果也前三果殘思在故則有悲感二聞法得度若有初入法者即前所作未辦人也望極果人通名初入聞佛所説即皆得度得度有二謂從凡入聖從聖至極皆名得度譬如夜見電光即得見道復以譬喻示現見道速疾決定義也二約已辦若所作已辦已度苦海者無學位人已盡見思出三界苦但作是念世尊滅度一何疾哉於小乘中雖名已辦其實所知障全在故見佛速滅由不了生本不生滅亦無滅生滅即非生滅故二為斷彼彼疑二初經家敘阿䨲樓馱雖説是語衆中皆悉了達四聖諦義聖者正也無漏正法得在心故諦有二義一者諦實二者審諦釋此二義如四聖諦品世尊欲令此諸大衆皆得堅固以大悲心復為衆説託高勗下寄現訓未也論云如來悲心淳至故不護上上法也二正斷疑六初自他俱滅汝等比丘勿懷悲惱若我住世一劫會亦當滅住世雖久時會亦滅會而不離終不可得上明自滅此言他滅豈唯我然一切皆爾會聚也既有聚會必歸離散聚散有二一師資聚散二五陰聚散是則一切皆無常也二法門常住自利修因得果利人説法化他法皆具足至聖流慈宣説法門無不具足此法常在世間衆生自可修學不須我住也三利他事畢若我久住更無所益法既具足我住何為四總顯已度應可度者若天上人間皆悉已度於彼彼衆自利事訖則是令彼彼天人修因得果也五示得因緣其未度者皆亦已作得度因緣其未修習者依不滅法門能作得度因緣則是已為下種未來熟脫法門在世可修學故六因果住持二初對因自今已後我諸弟子展轉行之因分住持不壞滅後弟子常依修習展轉傳授不斷絶也二對果則是如來法身常在而不滅也果分住持不壞以弟子所行之法不斷絶即是如來五分法身常在世也三重説有為無常相二初正示有為三初無常求脫是故當知世皆無常會必有離勿懷憂惱論云示現於此處勸修世間生猒離行故世相如是當勤精進早求解脫於有為相中得解脫故二以智滅癡以智慧明滅諸癡暗復示如實觀滅我我所見根本故三觀身不實世實危脆無堅牢者陰等諸法悉皆虛妄二引己作證二初略示已我今得滅如除惡病陰身如惡病得滅如病差二廣辨患相此是應捨罪惡之物假名為身沒在老病生死大海論云復示可猒患相唯有智者得除滅之如殺怨賊而得歡喜唯有智人能猒能喜七離種種自性清淨無我分二初對治自性障三初正明實慧汝等比丘常當一心知五陰法中種種妄相悉從心起故以心為主則令制之一處也二勸勤修習勤求出道以一心如實慧難可得故勸令精進三三界無常一切世間總標三界動不動法動即欲界不動即色無色界皆是敗壞不安之相結指無常二明清淨無我即是於甚深寂滅法中寂滅故文三初勸止三業汝等且止勿得復語靜口業也口業靜故則意亦靜也論云示三業無動是寂滅無我相應器故二示將歸滅時將欲過已當中夜所以不過表中道也中道二種如前説今顯表離斷常之中亦密表佛性中也我欲滅度我有三種一見二慢三名字如來見慢已盡隨順世間名字稱我今當灰滅假身則名字亦無即是無餘涅槃真無我法也三正顯遺訓是我最後之所教誨小乘訓世凡五十年今將涅槃更略教誡故云最後論云於住持法中勝以其遺教故也音釋販方願切買賤賣貴也貿莫候切易財也墾口佷切用力反土也媟私列切嬻也瑕疵何加切過也才支切病也蚖吾官切毒蛇也絺綌絺抽遲切綌乞逆切絺綌葛布也細曰絺粗曰綌狐狢狢曷各切狐狢並獸名藜糗藜憐題切落帚也初生可食糗丘救切熬米麥也憒閙憒古對切心亂也閙女教切不安靜也眷古倦切顧戀也諧枯回切謔也諧雄皆切調也嘲謔嘲陟交切謔迄却切嘲謔調戲也脆此芮切易斷也
